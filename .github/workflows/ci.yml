name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The patient-collab-demo consumes @esheet/* from the vendor/eSheet
      # submodule (built dists, wired via vite aliases) — build them before
      # the steps that need them.
      - run: pnpm --filter patient-collab-demo esheet:build
      # @mieweb/ui comes from the vendor/ui submodule the same way; its own
      # preinstall inits that submodule's nested submodules.
      - run: pnpm --filter patient-collab-demo ui:build
      # `pnpm run ci` — a bare `pnpm ci` hits pnpm's unimplemented built-in
      # instead of the package script.
      - run: pnpm run ci
      - run: pnpm --filter patient-collab-demo typecheck
      - run: pnpm --filter patient-collab-demo build
